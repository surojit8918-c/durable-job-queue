services:
  db:
    image: postgres:15-alpine
    container_name: job_queue_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: job_queue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_queue"]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migration:
    build: .
    container_name: job_queue_migration
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/job_queue
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: job_queue_api
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/job_queue
      WORKER_ID: api-server
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker-1:
    build: .
    container_name: job_queue_worker_1
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/job_queue
      WORKER_ID: worker-1
      WORKER_POLL_INTERVAL: 1.0
      LEASE_DURATION_SECONDS: 60
      LEASE_RENEWAL_INTERVAL_SECONDS: 15
      HANDLER_TIMEOUT_SECONDS: 30
      GRACEFUL_SHUTDOWN_SECONDS: 35
    command: python -m app.workers.worker
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-2:
    build: .
    container_name: job_queue_worker_2
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/job_queue
      WORKER_ID: worker-2
      WORKER_POLL_INTERVAL: 1.0
      LEASE_DURATION_SECONDS: 60
      LEASE_RENEWAL_INTERVAL_SECONDS: 15
      HANDLER_TIMEOUT_SECONDS: 30
      GRACEFUL_SHUTDOWN_SECONDS: 35
    command: python -m app.workers.worker
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
